<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142143" />
      <stop offset="100%" stop-color="#091024" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#d4a34b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="160" height="190" rx="12" fill="url(#bgGrad)" />
  <!-- Halo / Sacred Rim -->
  <circle cx="80" cy="72" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
  <!-- Veil Outer Habit -->
  <path d="M42 66 C42 42, 118 42, 118 66 C118 92, 124 135, 126 190 L34 190 C36 135, 42 92, 42 66 Z" fill="#1b243b" stroke="#2a3b60" stroke-width="1" />
  <!-- White Wimple / Forehead Band -->
  <path d="M54 58 C62 50, 98 50, 106 58 C108 65, 108 76, 106 82 C98 94, 62 94, 54 82 C52 76, 52 65, 54 58 Z" fill="#ffffff" />
  <!-- Sister Face -->
  <path d="M60 64 C64 56, 96 56, 100 64 C104 74, 102 88, 80 92 C58 88, 56 74, 60 64 Z" fill="#f8dfcb" />
  <!-- White Collarette / Guimpe -->
  <path d="M48 94 C60 90, 100 90, 112 94 C116 120, 120 145, 122 190 L38 190 C40 145, 44 120, 48 94 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <!-- Cross on Chest -->
  <g transform="translate(80, 128)" stroke="#d4a34b" stroke-width="2.2" stroke-linecap="round">
    <line x1="0" y1="-8" x2="0" y2="12" />
    <line x1="-6" y1="-2" x2="6" y2="-2" />
  </g>
</svg>
