<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1530" />
      <stop offset="50%" stop-color="#142452" />
      <stop offset="100%" stop-color="#070d1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7b0" />
      <stop offset="35%" stop-color="#d4a34b" />
      <stop offset="100%" stop-color="#9a7024" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7024" />
      <stop offset="50%" stop-color="#d4a34b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#d4a34b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Circle/Shield -->
  <circle cx="256" cy="256" r="240" fill="url(#shieldGrad)" stroke="url(#goldRing)" stroke-width="12" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(212, 163, 75, 0.4)" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Sacred St. Thomas Cross (Nasrani / Mar Thoma Cross Inspired) -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5">
    <!-- Vertical Beam -->
    <path d="M 236 90 L 276 90 Q 284 90 284 100 L 284 390 Q 284 400 276 400 L 236 400 Q 228 400 228 390 L 228 100 Q 228 90 236 90 Z" />
    <!-- Horizontal Beam -->
    <path d="M 130 196 L 382 196 Q 392 196 392 206 L 392 246 Q 392 256 382 256 L 130 256 Q 120 256 120 246 L 120 206 Q 120 196 130 196 Z" />
    <!-- Top Trefoil / Budded End -->
    <circle cx="256" cy="80" r="18" />
    <!-- Left Trefoil -->
    <circle cx="110" cy="226" r="18" />
    <!-- Right Trefoil -->
    <circle cx="402" cy="226" r="18" />
    <!-- Bottom Base Calyx / Lotus Petals -->
    <path d="M 210 400 Q 256 375 302 400 Q 320 425 256 438 Q 192 425 210 400 Z" />
  </g>
</svg>
