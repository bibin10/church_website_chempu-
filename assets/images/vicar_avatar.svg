<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1c3f"/>
      <stop offset="100%" stop-color="#182e66"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4a34b"/>
      <stop offset="100%" stop-color="#996d1e"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Halo / Glow Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(212,163,75,0.2)" stroke-width="1.5"/>
  <!-- Head Silhouette -->
  <circle cx="100" cy="72" r="30" fill="#e6dbca"/>
